{{- if and .Values.oidcAuth.enabled (eq .Values.oidcAuth.existingSecret.name "") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlflow.fullname" . }}-oidc-auth-secret
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{ tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- if .Values.oidcAuth.clientSecret }}
  {{ (tpl .Values.oidcAuth.existingSecret.clientSecretKey .) }}: {{ (tpl .Values.oidcAuth.clientSecret .) | quote }}
  {{- end }}
{{- end }}
