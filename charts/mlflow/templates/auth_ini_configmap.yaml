{{- if or .Values.auth.enabled .Values.ldapAuth.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "mlflow.fullname" . }}-auth-ini-template
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
data:
  auth_template.ini: |
    {{- include "mlflow.authIni" . | nindent 4 }}
{{- end }}
